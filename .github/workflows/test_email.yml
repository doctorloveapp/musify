name: Test Email Notification

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send Test Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Test Musify - Email funziona!"
          body: |
            Ciao,

            Questa è una email di test.
            Se la stai leggendo, significa che le secret e l'invio email funzionano correttamente.

            Puoi cancellare il file test_email.yml dopo questo test.
          to: doctorloveapp@gmail.com
          from: Musify Test Bot <bot@musify.com>