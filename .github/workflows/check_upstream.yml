name: Monitor Upstream Critical Dependencies

on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musify-upstream-sentinel
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TARGET_EMAIL: "doctorloveapp@gmail.com"
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test sentinel without network or email
        run: python -m unittest discover -s scripts/tests -p 'test_upstream_monitor.py' -v

      - name: Compare immutable upstream snapshots
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_upstream.py

      - name: Send Notification Email
        id: notify
        if: steps.check.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Musify: ${{ steps.check.outputs.change_count }} modifiche upstream da revisionare"
          body: file://artifacts/upstream-monitor/notification.txt
          to: ${{ env.TARGET_EMAIL }}
          from: Musify Monitor <${{ secrets.MAIL_USERNAME }}>

      - name: Report failed monitoring separately
        if: failure() && steps.notify.outcome != 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Musify: controllo sentinella non riuscito"
          body: |
            La sentinella non ha completato la verifica.
            Questo NON significa che i sorgenti upstream siano cambiati.
            Controllare il log del workflow; la baseline non e stata aggiornata.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ env.TARGET_EMAIL }}
          from: Musify Monitor <${{ secrets.MAIL_USERNAME }}>
